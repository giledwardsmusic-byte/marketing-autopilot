name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Syntax check
        run: |
          node --check src/entry.js
          node --check src/index.js
          node --check src/lib/ai.js
          node --check src/lib/auth.js
          node --check src/lib/autopilot-maintenance.js
          node --check src/lib/campaign-engine.js
          node --check src/lib/connector-preflight.js
          node --check src/lib/db.js
          node --check src/lib/google-drive-sync.js
          node --check src/lib/instagram-direct.js
          node --check src/lib/media-normalization.js
          node --check src/lib/notifications.js
          node --check src/lib/pinterest-direct.js
          node --check src/lib/pinterest-oauth.js
          node --check src/lib/publishers.js
          node --check src/lib/sandbox.js
          node --check src/lib/schema-bootstrap.js
          node --check src/lib/security.js
          node --check src/lib/table-rock-seed.js
          node --check src/lib/tiktok-direct.js
          node --check src/lib/tiktok-oauth.js
          node --check src/lib/tiktok-reconcile.js
          node --check src/lib/utils.js
          node --check public/autopilot.js
          node --check public/app.js
      - name: Worker bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

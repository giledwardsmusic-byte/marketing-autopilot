name: Deploy and verify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: marketing-autopilot-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MA_BASE_URL: https://marketing-autopilot.giledwardsmusic.workers.dev
      MA_RELEASE_ID: 2026-08-25-social-oauth-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Detect deploy credentials
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
          fi
      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Verify live release
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          # Cloudflare can take a few seconds to make the new Worker globally visible.
          for attempt in 1 2 3 4 5 6; do
            if npm run probe:live; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "Deployment completed, but the expected live release did not become visible in time." >&2
          exit 1

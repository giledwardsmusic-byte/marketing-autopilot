name: Diagnose Pinterest failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pinterest.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Query latest Pinterest failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute marketing-autopilot --remote --command "SELECT id,status,error_message,scheduled_for,published_at,external_post_id FROM scheduled_posts WHERE lower(platform)='pinterest' AND status='failed' ORDER BY updated_at DESC LIMIT 3;"
          npx wrangler d1 execute marketing-autopilot --remote --command "SELECT id,name,connector_type,platform,enabled,last_error_at,last_error,config_json FROM connectors WHERE lower(platform)='pinterest' ORDER BY priority ASC;"

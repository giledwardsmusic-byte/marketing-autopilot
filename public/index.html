<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>Marketing Autopilot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth" class="auth-shell hidden">
    <section class="auth-card">
      <div class="brandmark">MA</div>
      <h1>Marketing Autopilot</h1>
      <p id="auth-note">Sign in to manage your marketing system.</p>
      <form id="login-form" class="stack">
        <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
        <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <button id="bootstrap-btn" class="secondary hidden">Initialize owner account</button>
      <p id="auth-error" class="error"></p>
    </section>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <div>
        <div class="eyebrow">MARKETING AUTOPILOT</div>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <button id="logout-btn" class="ghost">Sign out</button>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-view="dashboard" class="nav-btn active"><span>⌂</span><small>Dashboard</small></button>
      <button data-view="week" class="nav-btn"><span>▦</span><small>This Week</small></button>
      <button data-view="products" class="nav-btn"><span>□</span><small>Products</small></button>
      <button data-view="creative" class="nav-btn"><span>◫</span><small>Creative</small></button>
      <button data-view="performance" class="nav-btn"><span>↗</span><small>Results</small></button>
      <button data-view="attention" class="nav-btn"><span>!</span><small>Attention</small></button>
      <button data-view="settings" class="nav-btn"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <script src="/session-fix.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>

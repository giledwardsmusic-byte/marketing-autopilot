<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b1f1d">
  <title>Marketing Autopilot</title>
  <link rel="stylesheet" href="/autopilot.css?v=2">
</head>
<body>
  <div id="login" class="login-screen hidden">
    <div class="login-box">
      <div class="login-mark">MA</div>
      <h1>Marketing Autopilot</h1>
      <p id="loginNote" class="sub">Open your marketing dashboard.</p>
      <form id="loginForm">
        <label>Email</label><input id="loginEmail" type="email" autocomplete="username" value="giledwardsmusic@gmail.com" required>
        <input id="loginPassword" type="hidden" value="">
        <button class="btn primary wide" type="submit">Open app</button>
      </form>
      <button id="bootstrapBtn" class="btn primary wide hidden" type="button">Initialize owner account</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="status-strip">
      <div id="healthOrb" class="orb green"></div>
      <div id="healthLabel" class="status-label">Checking system…</div>
      <div class="status-title">Autopilot</div>
      <button id="signout" class="signout">Sign out</button>
    </header>
    <main id="main" class="main"><div class="empty">Loading…</div></main>
    <nav class="tabs" aria-label="Primary">
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="week">This Week</button>
      <button data-tab="products">Products</button>
      <button data-tab="library">Library</button>
      <button data-tab="performance">Results</button>
      <button data-tab="attention">Attention<span id="attnDot" class="dot hidden"></span></button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>
  <div id="toast" class="toast hidden"></div>
  <dialog id="modal"><div id="modalBody"></div></dialog>
  <script type="module" src="/autopilot.js?v=3"></script>
</body>
</html>

name = "marketing-autopilot"
main = "src/runtime.js"
compatibility_date = "2026-08-01"
keep_vars = true

[assets]
directory = "./public"
binding = "STATIC"

[[d1_databases]]
binding = "DB"
database_name = "marketing-autopilot"
database_id = "614d603d-1d82-4751-8e0d-143026c83813"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "marketing-autopilot-media"

[images]
binding = "IMAGES"

[cache]
enabled = true

[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

[vars]
APP_NAME = "Marketing Autopilot"
APP_ORIGIN = "https://marketing-autopilot.giledwardsmusic.workers.dev"
AI_PROVIDER = "none"
AI_MODEL = ""
APPROVED_MONTHLY_COST_CENTS = "0"
AUTOPILOT_ENABLED = "true"
META_APP_ID = "2003328426979752"
